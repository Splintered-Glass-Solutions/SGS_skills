<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task report card</title>
<style>
:root{color-scheme:light;--ink:#15233a;--muted:#637084;--line:#e1e8ef;--bg:#f4f7fa;--green:#147e59;--teal:#08757a;--red:#ba3346;--blue:#2465b6;--grey:#6b7787}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1180px;margin:auto;padding:24px 24px 72px}h1,h2,p{margin:0}.header{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.68rem;font-weight:800;color:var(--blue)}h1{font-size:clamp(1.9rem,4vw,2.5rem);line-height:1.1;letter-spacing:-.035em;margin-top:3px}.stamp,.sub{color:var(--muted);font-size:.78rem}.sub{margin-top:4px}.focus{margin-top:18px;padding:13px 16px;display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #f2cdd2;border-left:4px solid var(--red);border-radius:9px}.focus.progress-focus{border-color:#cdddF3;border-left-color:var(--blue)}.focus strong{font-size:.98rem}.focus .focus-note{color:var(--muted);font-size:.82rem}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 14px;min-width:0;text-align:left;transition:border-color .15s,box-shadow .15s}.stat:hover{border-color:#a8b9cb}.stat[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}.stat.done{color:var(--green)}.stat.local_working{color:var(--teal)}.stat.blocked{color:var(--red)}.stat.progress{color:var(--blue)}.stat.not_started{color:var(--grey)}.stat strong{display:inline-block;font-size:1.45rem;line-height:1}.stat span{font-size:.78rem;color:var(--muted);margin-left:7px}.stat .stat-percent{display:block;margin:5px 0 0;color:inherit;font-size:.72rem;font-weight:600}.stat.done strong{color:var(--green)}.stat.local_working strong{color:var(--teal)}.stat.blocked strong{color:var(--red)}.stat.progress strong{color:var(--blue)}.stat.not_started strong{color:var(--grey)}.usage{margin:12px 0 0;display:flex;gap:18px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.78rem}.usage b{color:var(--ink)}.usage details{display:inline}.usage summary{cursor:pointer;text-decoration:underline;text-underline-offset:3px}.usage-detail{margin:8px 0 0;padding:12px 14px;background:white;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:.78rem}.coverage{margin-top:12px;color:var(--muted);font-size:.76rem}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:17px 0 10px}input,select,button{font:inherit;border:1px solid #cfd9e4;border-radius:7px;padding:8px 10px;background:#fff;color:var(--ink)}input{flex:1;min-width:160px}button{cursor:pointer}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:hidden}.panel>summary{display:flex;align-items:center;gap:10px;justify-content:space-between;cursor:pointer;list-style:none;padding:12px 15px}.panel>summary::-webkit-details-marker,.item>summary::-webkit-details-marker{display:none}.panel>summary:after{content:"+";font-size:1.15rem;color:var(--muted)}.panel[open]>summary:after{content:"−"}.panel h2{font-size:.95rem}.group-count{margin-left:auto;color:var(--muted);font-size:.75rem;white-space:nowrap}.section-desc{padding:0 15px 10px;color:var(--muted);font-size:.78rem}.item{border-top:1px solid #edf1f5}.item>summary{display:grid;grid-template-columns:minmax(0,1fr) auto 20px;align-items:center;gap:12px;padding:10px 15px;cursor:pointer;list-style:none}.item>summary:after{content:"+";color:#8c99aa;text-align:center}.item[open]>summary:after{content:"−"}.item-label{min-width:0}.item-id{color:var(--muted);font-size:.7rem;margin-right:7px}.item-name{font-weight:650}.item-plain{display:block;margin-top:4px;color:var(--muted);font-size:.79rem;font-weight:400;white-space:normal;overflow-wrap:anywhere}.status-cell{display:flex;align-items:center;gap:8px;white-space:nowrap}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 8px;font-weight:700;font-size:.7rem;white-space:nowrap}.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.badge.done{color:var(--green);background:#e6f6ed}.badge.local_working{color:var(--teal);background:#e2f5f4}.badge.blocked{color:var(--red);background:#fff0f1}.badge.progress{color:var(--blue);background:#eaf2ff}.badge.not_started{color:var(--grey);background:#edf0f3}.percentage{font-size:.75rem;color:var(--muted);min-width:33px;text-align:right}.item-details{padding:0 15px 13px;color:var(--muted);font-size:.8rem;max-width:900px}.item-details p{margin:4px 0;overflow-wrap:anywhere}.history{margin-top:8px}.history>summary{cursor:pointer;color:var(--blue);font-weight:600}.history>p{line-height:1.55}.decision{margin:8px 0 12px;padding:12px;border:1px solid #dce7f3;border-radius:8px;background:#f7faff;color:var(--ink)}.decision h3{font-size:.82rem;margin:0 0 4px}.decision ol{padding-left:23px;margin:6px 0 0}.decision li{padding:3px 0;overflow-wrap:anywhere}.decision .recommended{color:var(--green);font-weight:700}.item-details b{color:var(--ink)}a{color:#1d5ba2}.footer{font-size:.76rem;color:var(--muted);margin-top:20px}summary:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #91bdf3;outline-offset:2px}.empty{padding:20px;color:var(--muted);text-align:center}@media(max-width:600px){main{padding:18px 14px 50px}.stats{grid-template-columns:repeat(2,1fr)}.focus{align-items:flex-start;flex-direction:column;gap:3px}.usage{gap:10px 14px}.item>summary{grid-template-columns:minmax(0,1fr) auto 14px;gap:5px}.item-id{display:block}.status-cell{gap:4px}.percentage{min-width:28px}.toolbar input{flex-basis:100%}}
.choice-row{display:flex;align-items:flex-start;gap:7px}.choice-check{flex:none;min-width:0;width:18px;height:18px;margin:7px 0 0;padding:0;accent-color:var(--blue)}.bulk-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}.bulk-actions button:disabled{opacity:.5;cursor:not-allowed}.bulk-fallback{width:100%;min-height:70px;font:inherit}.choice-copy{display:block;width:100%;padding:5px 7px;text-align:left;background:transparent;border:1px solid transparent;border-radius:5px;color:inherit}.choice-copy:hover,.choice-copy:focus-visible{background:#e9f2ff;border-color:#b8d2f1}.choice-copy::after{content:'  Copy';color:var(--blue);font-size:.72rem;font-weight:600;white-space:nowrap}.copy-feedback{min-height:1em;color:var(--green);font-size:.75rem}.copy-feedback.failed{color:var(--red)}
.goal-summary{max-width:68ch;margin-top:10px;color:var(--ink);font-size:.9rem;line-height:1.5;overflow-wrap:anywhere}.goal-summary:empty{display:none}
.icon-button,.filter-control{width:42px;height:42px;flex:0 0 42px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #cfd9e4;border-radius:7px;background:#fff;color:var(--ink)}.icon-button{padding:10px}.icon-button svg,.filter-control svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.filter-control{position:relative}.filter-control select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.filter-control.active{color:var(--blue);border-color:var(--blue);background:#eaf2ff}.filter-control:focus-within{outline:3px solid #91bdf3;outline-offset:2px}
.focus-disclosure{display:block}.focus-disclosure>summary{display:flex;align-items:flex-start;gap:14px;cursor:pointer;list-style:none}.focus-disclosure>summary::-webkit-details-marker{display:none}.focus-disclosure>summary:after{content:"+";margin-left:auto;color:var(--red);font-size:1.1rem}.focus-disclosure[open]>summary:after{content:"−"}.focus-disclosure .focus-text{flex:1;min-width:0}.focus-note{display:block}.focus-disclosure .decision{margin:14px 0 0}.focus-text{min-width:0}@media(max-width:600px){.focus-disclosure>summary{flex-wrap:wrap;gap:8px}.focus-disclosure .focus-text{flex:1 1 100%;order:3}}
.bulk-actions:not([hidden]){position:fixed;z-index:20;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:min(440px,calc(100vw - 32px));margin:0;box-shadow:0 10px 30px #15233a24}.bulk-actions[hidden]{display:none}.bulk-actions #copy-selected{background:var(--blue);border-color:var(--blue);color:white;font-weight:700}.bulk-actions .bulk-fallback{max-height:25vh;overflow:auto}@media print{.bulk-actions{display:none!important}}
/* Keep counts, long labels, and controls readable at every width. */
.header>div,.focus>div,.panel h2,.item-name,.choice-copy{min-width:0;overflow-wrap:anywhere}
.stat{display:flex;flex-direction:column;align-items:flex-start;gap:4px;line-height:1.25}
.stat span{display:block;margin:0;overflow-wrap:anywhere}.stat .stat-percent{margin:1px 0 0}
.focus{align-items:flex-start}.focus .badge{flex-shrink:0}.focus-note{margin-top:4px;line-height:1.5;overflow-wrap:anywhere}
.panel>summary{align-items:flex-start}.panel h2{line-height:1.35}.item-name{line-height:1.4}.item-plain{line-height:1.5}
.decision li{padding:5px 0}.choice-row{min-width:0}.choice-copy{flex:1;min-width:0;line-height:1.5}.bulk-actions{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}.bulk-actions span{font-size:.8rem;color:var(--muted)}
@media(max-width:900px) and (min-width:601px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:10px 12px}.item>summary{grid-template-columns:minmax(0,1fr) 16px;align-items:start;row-gap:7px}.item-label{grid-column:1}.status-cell{grid-column:1;grid-row:2;flex-wrap:wrap;white-space:normal}.item>summary:after{grid-column:2;grid-row:1}.badge{white-space:normal;line-height:1.3}.badge:before{flex:none}.toolbar select{max-width:100%}.bulk-actions button{flex:1 1 auto}.decision{padding:10px}.decision ol{padding-left:20px}}
@media print{.toolbar{display:none}body{background:#fff}.panel{break-inside:avoid}.choice-copy::after{content:''}}
</style>
</head><body><main>
<header class="header"><div><div class="eyebrow">Task report card</div><h1 id="title"></h1><p class="sub" id="subtitle"></p><p class="goal-summary" id="goal-summary"></p></div><div class="stamp" id="stamp"></div></header>
<div id="focus"></div><div class="stats" id="stats"></div>
<details class="usage-detail"><summary>How to read these numbers</summary><div id="basis"></div></details>
<div class="toolbar"><input id="search" type="search" aria-label="Search items" placeholder="Search items or IDs"><span id="filter-control" class="filter-control" title="Filter by status"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16l-6.5 7.2v5.5l-3 1.7v-7.2z"/></svg><select id="filter" aria-label="Filter by status"><option value="all">All statuses</option><option value="done">Deployed and verified on Dev</option><option value="local_working">Working locally</option><option value="blocked">Blocked</option><option value="progress">In progress</option><option value="not_started">Not started</option></select></span><button class="icon-button" id="expand" type="button" aria-label="Expand sections" title="Expand sections"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6M6 4l6 6 6-6"/></svg></button><button class="icon-button" id="collapse" type="button" aria-label="Collapse sections" title="Collapse sections"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6M6 20l6-6 6 6"/></svg></button></div><p class="coverage" id="result-count" role="status" aria-live="polite"></p>
<div class="bulk-actions" id="bulk-actions" hidden><button id="copy-selected" type="button" disabled>Copy selected paths (0)</button><button id="clear-selected" type="button" disabled>Clear selection</button><span id="bulk-feedback" role="status" aria-live="polite"></span><textarea id="bulk-fallback" class="bulk-fallback" aria-label="Selected paths to copy manually" readonly hidden></textarea></div>
<div id="sections"></div><div class="footer" id="footer"></div>
</main><script id="report-data" type="application/json">__TASK_REPORT_DATA__</script>
<script>
(function(){
const d=JSON.parse(document.getElementById("report-data").textContent);
const labels={done:"Deployed and verified on Dev",local_working:"Working locally",blocked:"Blocked",progress:"In progress",not_started:"Not started"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const all=d.sections.flatMap(s=>s.items),counts=all.reduce((a,x)=>(a[x.status]=(a[x.status]||0)+1,a),{});
const fmt=n=>typeof n==="number"?new Intl.NumberFormat("en-US").format(n):n||"Unknown";
const compactTokens=typeof d.tokens==="number"?new Intl.NumberFormat("en-US",{notation:"compact",maximumFractionDigits:2}).format(d.tokens):fmt(d.tokens);
document.title=d.title+" · Task report card";document.getElementById("title").textContent=d.title;document.getElementById("subtitle").textContent=d.subtitle;document.getElementById("goal-summary").textContent=d.goalSummary||"";document.getElementById("stamp").textContent="As of "+d.updated;

const cards=[["done","Deployed and verified on Dev"],["local_working","Working locally"],["blocked","Blocked"],["progress","In progress"],["not_started","Not started"]];document.getElementById("stats").innerHTML=cards.map(([k,l])=>'<button type="button" class="stat '+k+'" data-filter="'+k+'" aria-pressed="false" aria-label="'+esc(l)+': '+fmt(counts[k]||0)+' entries. Filter by '+esc(l)+'"><strong>'+fmt(counts[k]||0)+'</strong><span>'+esc(l)+'</span><span class="stat-percent">'+(all.length?Math.round((counts[k]||0)*1000/all.length)/10:0)+'% of entries</span></button>').join("");
document.getElementById("basis").innerHTML='<p><b>Activity:</b> '+esc(fmt(d.threads))+' chats · '+esc(fmt(d.agents))+' subagent runs · '+esc(fmt(d.tokens))+' tokens · '+esc(d.elapsed||"Unknown")+' elapsed · '+all.length+' entries (including overlaps).</p><p><b>Statuses:</b> Green means deployed and verified on Dev; teal means the item works locally but Dev verification remains. Blue includes reconciliation; percentages are rough estimates. A recorded blocker may be historical until checked.</p><p><b>Tokens ('+esc(fmt(d.tokens))+'):</b> '+esc(d.tokenBasis)+'</p><p><b>Time:</b> '+esc(d.elapsedBasis)+'</p><p>'+esc(d.checkpoint||"")+'</p>';
const root=document.getElementById("sections"), focusRoot=document.getElementById("focus"), selectedPaths=new Set();
function updateBulk(){const n=selectedPaths.size;document.getElementById("bulk-actions").hidden=n===0;document.getElementById("copy-selected").textContent="Copy selected paths ("+n+")";document.getElementById("copy-selected").disabled=n===0;document.getElementById("clear-selected").disabled=n===0;document.getElementById("bulk-feedback").textContent="";document.getElementById("bulk-fallback").hidden=true;}
function decisionMarkup(x){const opts=Array.isArray(x.options)?x.options:[];return opts.length||x.status==="blocked"?'<div class="decision"><h3>Possible paths</h3>'+(opts.length?'<ol type="A">'+opts.slice(0,3).map((o,i)=>'<li><div class="choice-row"><input class="choice-check" type="checkbox" data-choice="'+esc(x.id+' - '+String.fromCharCode(65+i)+': '+o.label)+'" aria-label="'+esc('Select '+x.id+' choice '+String.fromCharCode(65+i)+' for bulk copy')+'"'+(selectedPaths.has(x.id+' - '+String.fromCharCode(65+i)+': '+o.label)?' checked':'')+'><button class="choice-copy" type="button" data-copy="'+esc(x.id+' - '+String.fromCharCode(65+i)+': '+o.label)+'" aria-label="'+esc('Copy '+x.id+' choice '+String.fromCharCode(65+i))+'"><b>'+esc(o.label)+'</b>'+(o.selected?' <span class="recommended">(Selected)</span>':o.recommended?' <span class="recommended">(Recommended)</span>':'')+' — '+esc(o.description)+'</button></div></li>').join('')+'</ol><p class="copy-feedback" role="status" aria-live="polite"></p>':'<p>Options have not been assessed yet.</p>')+'</div>':'';}
const firstBlocked=all.find(x=>x.status==="blocked"),headline=d.headline||{};
const headlineItem=headline.itemId?all.find(x=>x.id===headline.itemId):(!headline.title?firstBlocked:null);
if(headline.title||firstBlocked){const isBlocked=headline.status?headline.status==="blocked":Boolean(firstBlocked);const heading='<span class="badge '+(isBlocked?'blocked':'progress')+'">'+(isBlocked?'Current blocker':'Current focus')+'</span><span class="focus-text"><strong>'+esc(headline.title||firstBlocked.title)+'</strong>'+(headline.note?'<span class="focus-note">'+esc(headline.note)+'</span>':'')+'</span>';focusRoot.innerHTML=isBlocked&&headlineItem?'<details class="focus focus-disclosure"><summary>'+heading+'</summary>'+decisionMarkup(headlineItem)+'</details>':'<div class="focus '+(isBlocked?'':'progress-focus')+'">'+heading+'</div>';}
function render(){const query=document.getElementById("search").value.trim().toLowerCase(),filter=document.getElementById("filter").value;let html="",shown=0;document.getElementById("filter-control").classList.toggle("active",filter!=="all");document.querySelectorAll(".stat[data-filter]").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.filter===filter)));
d.sections.forEach((s,index)=>{const rows=s.items.filter(x=>(filter==="all"||x.status===filter)&&(!query||[x.id,x.title,x.detail,x.note,x.sheetStatus,x.plainSummary,...(Array.isArray(x.options)?x.options.flatMap(o=>[o.label,o.description]):[])].join(" ").toLowerCase().includes(query)));if(!rows.length)return;shown+=rows.length;
html+='<details class="panel" '+(index===0||query||filter!=="all"?"open":"")+'><summary><h2>'+esc(s.title)+'</h2><span class="group-count">'+rows.length+' item'+(rows.length===1?'':'s')+'</span></summary><p class="section-desc">'+esc(s.description||"")+'</p>';
rows.forEach(x=>{const p=typeof x.progress==="number"?Math.min(100,Math.max(0,x.progress)):null;const source=x.source&&/^https:\/\//.test(x.source)?' · <a href="'+esc(x.source)+'" target="_blank" rel="noopener">Source</a>':"";const meta=[x.sheetStatus?"Source status: "+x.sheetStatus:"",x.priority?"Priority: "+x.priority:"",x.environment?"Environment: "+x.environment:"",x.sheetRow?"Sheet row: "+x.sheetRow:""].filter(Boolean).map(esc).join(" · ");
const decision=decisionMarkup(x);
html+='<details class="item"><summary><span class="item-label"><span class="item-id">'+esc(x.id)+'</span><span class="item-name">'+esc(x.title)+'</span>'+(x.plainSummary?'<span class="item-plain">'+esc(x.plainSummary)+'</span>':x.status==="blocked"?'<span class="item-plain">Blocker explanation not yet added.</span>':'')+'</span><span class="status-cell"><span class="badge '+esc(x.status)+'">'+esc(labels[x.status]||"Unknown")+'</span>'+(p!==null?'<span class="percentage">~'+p+'%</span>':"")+'</span></summary><div class="item-details">'+decision+(String(x.detail||'').length>600?'<details class="history"><summary>Evidence and history</summary><p>'+esc(x.detail)+'</p></details>':'<p>'+esc(x.detail)+'</p>')+(meta||source?'<p>'+meta+source+'</p>':"")+(x.note?'<p><b>Recorded note:</b> '+esc(x.note)+'</p>':"")+'<p><b>Time:</b> '+esc(x.time||"Unknown")+' · <b>Tokens:</b> '+esc(x.tokens||"Unknown")+'</p>'+(x.usageNote?'<p><b>Usage basis:</b> '+esc(x.usageNote)+'</p>':"")+'</div></details>';});html+='</details>';});root.innerHTML=html||'<p class="empty">No items match this filter.</p>';document.getElementById('result-count').textContent=(query||filter!=='all')?shown+' of '+all.length+' entries shown':'';}
[root,focusRoot].forEach(container=>container.addEventListener("change",event=>{const box=event.target.closest("input[data-choice]");if(!box)return;if(box.checked)selectedPaths.add(box.dataset.choice);else selectedPaths.delete(box.dataset.choice);document.querySelectorAll("input[data-choice]").forEach(other=>{if(other.dataset.choice===box.dataset.choice)other.checked=box.checked;});updateBulk();}));
document.getElementById("clear-selected").addEventListener("click",()=>{selectedPaths.clear();document.querySelectorAll("input[data-choice]").forEach(box=>box.checked=false);updateBulk();});
document.getElementById("copy-selected").addEventListener("click",async()=>{if(!selectedPaths.size)return;const value=Array.from(selectedPaths).join("\n"),feedback=document.getElementById("bulk-feedback"),fallback=document.getElementById("bulk-fallback");let copied=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(value);copied=true;}}catch{}if(!copied){fallback.hidden=false;fallback.value=value;fallback.focus();fallback.select();try{copied=document.execCommand("copy");}catch{}if(copied)fallback.hidden=true;}feedback.textContent=copied?"Copied. Paste the selected paths into chat.":"Copy unavailable. Select and copy the paths below.";});
[root,focusRoot].forEach(container=>container.addEventListener("click",async event=>{const button=event.target.closest("button[data-copy]");if(!button)return;const value=button.dataset.copy,feedback=button.closest(".decision").querySelector(".copy-feedback");let copied=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(value);copied=true;}}catch{}if(!copied){const field=document.createElement("textarea");field.value=value;field.setAttribute("readonly","");field.style.cssText="position:fixed;left:-9999px;top:0";document.body.appendChild(field);field.select();try{copied=document.execCommand("copy");}catch{}field.remove();}feedback.classList.toggle("failed",!copied);feedback.textContent=copied?"Copied. Paste it into chat to confirm.":"Copy failed. Select and copy: "+value;}));
document.getElementById("stats").addEventListener("click",event=>{const button=event.target.closest("button[data-filter]");if(!button)return;const filter=document.getElementById("filter");filter.value=filter.value===button.dataset.filter?"all":button.dataset.filter;render();});
document.getElementById("search").addEventListener("input",render);document.getElementById("filter").addEventListener("change",render);document.getElementById("expand").addEventListener("click",()=>root.querySelectorAll(".panel").forEach(el=>el.open=true));document.getElementById("collapse").addEventListener("click",()=>root.querySelectorAll(".panel").forEach(el=>el.open=false));
const s=d.sources||{};document.getElementById("footer").innerHTML='Point-in-time report · '+Object.entries(s).filter(([,url])=>/^https:\/\//.test(url)).map(([name,url])=>'<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(name)+' source</a>').join(' · ');render();})();
</script></body></html>
