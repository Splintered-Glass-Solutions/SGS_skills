  dispatch parallel triage and fix slices, batch fixes across one or more repos, run
  full-suite-tests locally and in the requested hosted environment, deploy through
  PRs to dev or another non-production target, and post release notes back to the
  relevant thread. Use when the user asks the agent to watch a group text, Slack,
  Teams, email, or other testing thread during a coordinated test sweep and fix reported
  bugs until the temporary testing window ends."
