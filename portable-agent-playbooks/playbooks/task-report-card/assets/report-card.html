</head><body><main>
<header class="header"><div><div class="eyebrow">Task report card</div><h1 id="title"></h1><p class="sub" id="subtitle"></p><p class="goal-summary" id="goal-summary"></p></div><div class="header-meta"><div class="stamp" id="stamp"></div><a class="jump-link" href="#work-list">Browse work items ↓</a></div></header>

<section class="timers" aria-label="Task timers"><div><b>Since last status update</b><span id="timer-status">Unknown</span></div><div><b>Since last verified local feature</b><span id="timer-feature">Unknown</span></div><div><b>Elapsed since task start</b><span id="timer-task">Unknown</span></div></section>

</main><script id="report-data" type="application/json">__TASK_REPORT_DATA__</script>
<script>
(function(){
const d=JSON.parse(document.getElementById("report-data").textContent);
const labels={done:"Deployed to Dev",verified_dev:"Verified in Dev",local_working:"Local candidate / working",blocked:"Blocked",progress:"In progress",not_started:"Not started",deferred:"Deferred"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const fmt=n=>typeof n==="number"?new Intl.NumberFormat("en-US").format(n):n||"Unknown";
const validProof=v=>Boolean(v&&v.status==="passed"&&typeof v.evidence==="string"&&Boolean(safeUrl(v.evidence)));
const storyPassed=x=>validProof(x.localProof?.story);
const safeUrl=value=>{if(typeof value!=="string"||!value.trim())return "";try{const u=new URL(value,location.href);return ["file:","https:","http:"].includes(u.protocol)?u.href:"";}catch{return "";}};
const images=x=>Array.isArray(x.localProof?.screenshots)?x.localProof.screenshots.filter(v=>v&&safeUrl(v.path)).slice(0,2):[];
const localVerified=x=>storyPassed(x)&&validProof(x.localProof?.finishLine)&&images(x).length>0;
const devTested=x=>validProof(x.devProof);
const storyCount=all.filter(x=>x.status==="local_working"&&storyPassed(x)).length;
const isoDate=value=>typeof value==="string"&&/(?:Z|[+-]\d{2}:\d{2})$/.test(value)&&Number.isFinite(Date.parse(value))?Date.parse(value):null;
function tickTimers(){const now=Date.now(),end=isoDate(d.taskEndedAt);for(const [id,value,stop] of [["timer-status",d.statusUpdatedAt,now],["timer-feature",d.lastLocalSuccessAt,now],["timer-task",d.taskStartedAt,end??now]]){const el=document.getElementById(id),start=isoDate(value);if(start===null||(id==="timer-task"&&d.taskEndedAt&&end===null)||stop>now||start>stop){el.textContent="Unknown";el.title="No valid, non-future timestamp recorded";continue;}let seconds=Math.floor((stop-start)/1000);const days=Math.floor(seconds/86400);seconds%=86400;const hours=Math.floor(seconds/3600);seconds%=3600;const mins=Math.floor(seconds/60);seconds%=60;el.textContent=(days?days+"d ":"")+hours+"h "+mins+"m "+seconds+"s";el.title="Since "+value+(id==="timer-task"&&end!==null?"; ended "+d.taskEndedAt:"");}}tickTimers();setInterval(tickTimers,1000);
const answered=x=>Array.isArray(x.options)&&x.options.some(o=>o.selected===true);
const blocked=all.filter(x=>x.status==="blocked"), needsAnswer=blocked.filter(x=>x.blockerState==="needs_decision"||(!x.blockerState&&!answered(x))).length, afterAnswer=blocked.length-needsAnswer, answeredCount=all.filter(answered).length;
const compactTokens=typeof d.tokens==="number"?new Intl.NumberFormat("en-US",{notation:"compact",maximumFractionDigits:2}).format(d.tokens):fmt(d.tokens);
document.title=d.title+" · Task report card";document.getElementById("title").textContent=d.title;document.getElementById("subtitle").textContent=d.subtitle;document.getElementById("goal-summary").textContent=d.goalSummary||"";const stamp=document.getElementById("stamp"),updated=new Date(d.updated);stamp.textContent="Updated "+(Number.isNaN(updated.valueOf())?d.updated:new Intl.DateTimeFormat(undefined,{year:"numeric",month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZoneName:"short"}).format(updated));stamp.title=String(d.updated||"");

const cards=[["done","Deployed to Dev"],["verified_dev","Verified in Dev"],["local_working","Local candidate / working"],["blocked","Blocked"],["progress","In progress"],["not_started","Not started"],["deferred","Deferred"]];document.getElementById("stats").innerHTML=cards.map(([k,l])=>{const detail=k==="blocked"?needsAnswer+" need a path decision · "+afterAnswer+" blocked after path selected · "+answeredCount+" entries with selected paths":k==="local_working"?"User Story Ran (passed): "+storyCount:"";const detailHtml=k==="blocked"?needsAnswer+' need a decision<br>'+afterAnswer+' blocked after answer<br>'+answeredCount+' answered overall':esc(detail);return '<button type="button" class="stat '+k+'" data-filter="'+k+'" aria-pressed="false" aria-label="'+esc(l)+': '+fmt(counts[k]||0)+' entries. '+esc(detail)+'. Filter by '+esc(l)+'"><strong>'+fmt(counts[k]||0)+'</strong><span>'+esc(l)+'</span><span class="stat-percent">'+(all.length?Math.round((counts[k]||0)*1000/all.length)/10:0)+'% of entries</span>'+(detail?'<span class="stat-detail">'+detailHtml+'</span>':'')+'</button>';}).join("");
const history=Array.isArray(d.statusHistory)?d.statusHistory:[];
const timelineKinds=[["done","Deployed","var(--green)"],["verified_dev","Verified in Dev","#0d4f93"],["local_working","Local candidate / working","var(--teal)"],["progress","In progress","var(--blue)"],["blocked","Blocked","var(--red)"],["not_started","Not started","var(--grey)"],["deferred","Deferred","var(--purple)"]];

 const rows=history.map(point=>{const c=point.counts||{},total=timelineKinds.reduce((n,[k])=>n+(Number.isInteger(c[k])?c[k]:0),0),date=new Date(point.at),label=Number.isNaN(date.valueOf())?point.at:new Intl.DateTimeFormat(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}).format(date),details=timelineKinds.map(([k,l])=>l+': '+(Number.isInteger(c[k])?c[k]:'not tracked')).join(', '),segments=timelineKinds.map(([k,l,color])=>'<span class="timeline-segment" style="--segment:'+color+';height:'+(total?100*(c[k]||0)/total:0)+'%" title="'+esc(l+': '+(Number.isInteger(c[k])?c[k]:'not tracked'))+'"></span>').join('');return {c,total,label,details,segments,at:point.at};});
 timelineRoot.innerHTML='<div class="timeline-legend">'+legend+'</div><div class="timeline-scroll"><div class="timeline-bars" role="list" aria-label="Status count history">'+rows.map(r=>'<div class="timeline-point" role="listitem" aria-label="'+esc(r.label+': '+r.details+'; '+r.total+' entries')+'"><div class="timeline-stack" title="'+esc(r.label+': '+r.details)+'">'+r.segments+'</div><div class="timeline-date">'+esc(r.label)+'</div></div>').join('')+'</div></div><p class="timeline-note">Bars show recorded status counts. Verified in Dev was not tracked separately in earlier snapshots. Entry totals may include overlaps.</p><details class="timeline-table"><summary>View counts</summary><div><table><thead><tr><th>Update</th>'+timelineKinds.map(([,l])=>'<th>'+esc(l)+'</th>').join('')+'<th>Total</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.label)+'</td>'+timelineKinds.map(([k])=>'<td>'+(Number.isInteger(r.c[k])?r.c[k]:'Not tracked')+'</td>').join('')+'<td>'+r.total+'</td></tr>').join('')+'</tbody></table></div></details>';
 const scroller=timelineRoot.querySelector('.timeline-scroll');scroller.scrollLeft=scroller.scrollWidth;
}
const resources=Array.isArray(d.resourceHistory)?d.resourceHistory.filter(p=>p && typeof p.at==='string' && Number.isFinite(Date.parse(p.at))).sort((a,b)=>Date.parse(a.at)-Date.parse(b.at)):[];
const resourceRoot=document.getElementById('resource-history');
if(!resources.length){resourceRoot.innerHTML='<p class="timeline-empty">No resource samples recorded yet.</p>';}
else{
 const validRam=p=>Number.isFinite(p.ramAvailableGb)&&Number.isFinite(p.ramTotalGb)&&p.ramTotalGb>0;
 const validContext=p=>Number.isFinite(p.contextInputTokens)&&Number.isFinite(p.contextWindowTokens)&&p.contextWindowTokens>0;
 const ram=resources.filter(validRam),ctx=resources.filter(validContext),latestRam=ram.at(-1),latestCtx=ctx.at(-1);
 const t0=Date.parse(resources[0].at),t1=Date.parse(resources.at(-1).at),x=p=>40+(t1===t0?450:900*(Date.parse(p.at)-t0)/(t1-t0));
 const y=v=>140-Math.max(0,Math.min(100,v))*1.2,ramPct=p=>100*p.ramAvailableGb/p.ramTotalGb,ctxPct=p=>100*p.contextInputTokens/p.contextWindowTokens;
 const pt=(p,v,color,label)=>'<circle class="resource-dot" fill="'+color+'" cx="'+x(p).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="3.5"><title>'+esc(label)+'</title></circle>';
 const line=(items,fn,color)=>items.length>1?'<polyline class="resource-line" stroke="'+color+'" points="'+items.map(p=>x(p).toFixed(1)+','+y(fn(p)).toFixed(1)).join(' ')+'"/>':'';
 const groups=new Map();for(const p of ctx){const id=p.threadId||'unknown';if(!groups.has(id))groups.set(id,[]);groups.get(id).push(p);}
 const date=p=>new Date(p.at).toLocaleString();
 const graph='<svg class="resource-chart" viewBox="0 0 980 165" preserveAspectRatio="none" role="img" aria-label="Recorded available RAM and chat context window percentages over time"><line class="resource-grid" x1="40" y1="20" x2="940" y2="20"/><line class="resource-grid" x1="40" y1="80" x2="940" y2="80"/><line class="resource-grid" x1="40" y1="140" x2="940" y2="140"/><text x="2" y="24">100%</text><text x="8" y="84">50%</text><text x="15" y="144">0%</text>'+line(ram,ramPct,'#08757a')+Array.from(groups.values()).map(g=>line(g,ctxPct,'#7553a4')).join('')+ram.map(p=>pt(p,ramPct(p),'#08757a',date(p)+': '+p.ramAvailableGb.toFixed(2)+' GB available of '+p.ramTotalGb.toFixed(2)+' GB')).join('')+ctx.map(p=>pt(p,ctxPct(p),'#7553a4',date(p)+': '+ctxPct(p).toFixed(1)+'% context, chat '+(p.threadId||'unknown'))).join('')+'</svg>';
 const table=resources.map(p=>'<tr><td>'+esc(date(p))+'</td><td>'+(validRam(p)?esc(p.ramAvailableGb.toFixed(2)+' / '+p.ramTotalGb.toFixed(2)+' GB'):'—')+'</td><td>'+(validContext(p)?esc(ctxPct(p).toFixed(1)+'% ('+p.contextInputTokens.toLocaleString()+' / '+p.contextWindowTokens.toLocaleString()+')'):'—')+'</td><td>'+esc(p.ramPressure||'—')+'</td><td>'+esc(p.threadId||'—')+'</td></tr>').join('');
 resourceRoot.innerHTML='<div class="timeline-legend"><span class="legend-item"><span class="legend-swatch" style="--swatch:#08757a"></span>Available RAM (% of physical)</span><span class="legend-item"><span class="legend-swatch" style="--swatch:#7553a4"></span>Chat context used</span></div><p class="resource-summary">'+(latestRam?'Latest RAM: '+esc(latestRam.ramAvailableGb.toFixed(2))+' GB available of '+esc(latestRam.ramTotalGb.toFixed(2))+' GB ('+esc(date(latestRam))+(latestRam.ramPressure?' · pressure: '+esc(latestRam.ramPressure):'')+'). ':'RAM unavailable. ')+(latestCtx?'Latest context: '+esc(ctxPct(latestCtx).toFixed(1))+'% for chat '+esc((latestCtx.threadId||'unknown').slice(0,8))+' ('+esc(date(latestCtx))+').':'Context unavailable.')+'</p>'+graph+'<p class="timeline-note">RAM is an approximate free-plus-file-backed estimate; it is not a live monitor. Context is last request input divided by that chat’s reported window, not cumulative tokens or cost. Lines connect recorded samples, not continuous monitoring; context lines do not connect separate chats.</p><details class="timeline-table"><summary>View resource samples</summary><div class="resource-table-wrap"><table class="resource-table"><thead><tr><th>Recorded</th><th>Available / physical RAM</th><th>Context input / window</th><th>RAM pressure</th><th>Chat ID</th></tr></thead><tbody>'+table+'</tbody></table></div></details>';
}

document.getElementById("basis").innerHTML='<p><b>Activity:</b> '+esc(fmt(d.threads))+' chats · '+esc(fmt(d.agents))+' subagent runs · '+esc(fmt(d.tokens))+' tokens · '+esc(d.elapsed||"Unknown")+' elapsed · '+all.length+' entries (including overlaps).</p><p><b>Statuses:</b> Deployed to Dev counts deployed items awaiting complete verification; Verified in Dev counts separately those with passing evidence-linked Dev proof. Both are deployed. Teal includes local candidates and verified local work; story, finish-line and screenshot evidence determine the item label. Missing historical evidence is unknown, not a pass. Timers measure wall-clock time from recorded timestamps, not active labor. Blue includes reconciliation; purple marks work intentionally deferred. Percentages are rough estimates. Blocked counts distinguish entries needing a decision from entries blocked after an answer; answered entries include all statuses. Counts include overlapping report entries.</p><p><b>Tokens ('+esc(fmt(d.tokens))+'):</b> '+esc(d.tokenBasis)+'</p><p><b>Time:</b> '+esc(d.elapsedBasis)+'</p><p>'+esc(d.checkpoint||"")+'</p>';
const root=document.getElementById("sections"), focusRoot=document.getElementById("focus"), selectedPaths=new Set(), writeIns=new Map();
const draftKey="task-report-draft-v1:"+location.pathname;
try{const saved=JSON.parse(localStorage.getItem(draftKey)||"null");if(saved&&Array.isArray(saved.paths))saved.paths.filter(x=>typeof x==="string").forEach(x=>selectedPaths.add(x));if(saved&&Array.isArray(saved.notes))saved.notes.filter(x=>Array.isArray(x)&&typeof x[0]==="string"&&typeof x[1]==="string").forEach(([id,note])=>writeIns.set(id,note));}catch{}
function saveDraft(){try{localStorage.setItem(draftKey,JSON.stringify({paths:Array.from(selectedPaths),notes:Array.from(writeIns)}));}catch{}}
function updateBulk(){const n=selectedPaths.size+Array.from(writeIns.values()).filter(note=>note.trim()).length;document.getElementById("bulk-actions").hidden=n===0;document.getElementById("copy-selected").textContent="Copy choices and notes ("+n+")";document.getElementById("copy-selected").disabled=n===0;document.getElementById("clear-selected").disabled=n===0;document.getElementById("bulk-feedback").textContent="";document.getElementById("bulk-fallback").hidden=true;}
function decisionMarkup(x){const opts=Array.isArray(x.options)?x.options:[];return opts.length||x.status==="blocked"?'<div class="decision"><h3>Possible paths</h3><p class="choice-help">Check any combination and add a note. Copy them into chat to communicate your choice.</p>'+(opts.length?'<ol type="A">'+opts.map((o,i)=>'<li><div class="choice-row"><input class="choice-check" type="checkbox" data-choice="'+esc(x.id+' - '+String.fromCharCode(65+i)+': '+o.label)+'" aria-label="'+esc('Select '+x.id+' choice '+String.fromCharCode(65+i)+' for bulk copy')+'"'+(selectedPaths.has(x.id+' - '+String.fromCharCode(65+i)+': '+o.label)?' checked':'')+'><button class="choice-copy" type="button" data-copy="'+esc(x.id+' - '+String.fromCharCode(65+i)+': '+o.label)+'" aria-label="'+esc('Copy '+x.id+' choice '+String.fromCharCode(65+i))+'"><b>'+esc(o.label)+'</b>'+(o.selected?' <span class="recommended">(Selected)</span>':o.recommended?' <span class="recommended">(Recommended)</span>':'')+' — '+esc(o.description)+'</button></div></li>').join('')+'</ol>':'<p>Options have not been assessed yet.</p>')+'<label class="write-in-label">Write-in for '+esc(x.id)+'<textarea class="write-in" data-writein="'+esc(x.id)+'" placeholder="Add a note or another path">'+esc(writeIns.get(x.id)||'')+'</textarea></label><p class="copy-feedback" role="status" aria-live="polite"></p></div>':'';}
const firstBlocked=all.find(x=>x.status==="blocked"),headline=d.headline||{};
const headlineItem=headline.itemId?all.find(x=>x.id===headline.itemId):(!headline.title?firstBlocked:null);
if(headline.title||firstBlocked){const isBlocked=headline.status?headline.status==="blocked":Boolean(firstBlocked);const heading='<span class="badge '+(isBlocked?'blocked':'progress')+'">'+(isBlocked?'Current blocker':'Current focus')+'</span><span class="focus-text"><strong>'+esc(headline.title||firstBlocked.title)+'</strong>'+(headline.note?'<span class="focus-note">'+esc(headline.note)+'</span>':'')+'</span>';focusRoot.innerHTML=isBlocked&&headlineItem?'<details class="focus focus-disclosure"><summary>'+heading+'</summary>'+decisionMarkup(headlineItem)+'</details>':'<div class="focus '+(isBlocked?'':'progress-focus')+'">'+heading+'</div>';}
function render(){const query=document.getElementById("search").value.trim().toLowerCase(),filter=document.getElementById("filter").value;let html="",shown=0;document.getElementById("filter-control").classList.toggle("active",filter!=="all");document.querySelectorAll(".stat[data-filter]").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.filter===filter)));
d.sections.forEach((s,index)=>{const rows=s.items.filter(x=>(filter==="all"||x.status===filter)&&(!query||[x.id,x.title,x.detail,x.note,x.sheetStatus,x.plainSummary,...(Array.isArray(x.options)?x.options.flatMap(o=>[o.label,o.description]):[])].join(" ").toLowerCase().includes(query)));if(!rows.length)return;shown+=rows.length;
html+='<details class="panel" '+(index===0||query||filter!=="all"?"open":"")+'><summary><h2>'+esc(s.title)+'</h2><span class="group-count">'+rows.length+' item'+(rows.length===1?'':'s')+'</span></summary><p class="section-desc">'+esc(s.description||"")+'</p>';
rows.forEach(x=>{const p=typeof x.progress==="number"?Math.min(100,Math.max(0,x.progress)):null;const source=x.source&&/^https:\/\//.test(x.source)?' · <a href="'+esc(x.source)+'" target="_blank" rel="noopener">Source</a>':"";const meta=[x.sheetStatus?"Source status: "+x.sheetStatus:"",x.priority?"Priority: "+x.priority:"",x.environment?"Environment: "+x.environment:"",x.sheetRow?"Sheet row: "+x.sheetRow:""].filter(Boolean).map(esc).join(" · ");
const decision=decisionMarkup(x);
const proof=x.localProof||{},story=proof.story||{},finish=proof.finishLine||{},dev=x.devProof||{};
const badgeLabel=x.status==="local_working"?(localVerified(x)?"Working locally · user story passed":storyPassed(x)?"Local candidate · story passed, finish proof pending":"Local candidate · story not verified"):x.status==="done"?"Deployed to Dev":x.status==="verified_dev"?"Verified in Dev":(labels[x.status]||"Unknown");
const evidenceLink=(value,label)=>safeUrl(value)?'<a href="'+esc(safeUrl(value))+'">'+esc(label)+'</a>':esc(value||"Not recorded");
const proofText=(x.localProof||x.devProof||x.status==="local_working"||x.status==="done"||x.status==="verified_dev")?'<p><b>User story:</b> '+esc(story.status||"Unknown")+' · '+evidenceLink(story.evidence,"Story evidence")+' <b>Finish line:</b> '+esc(finish.status||"Unknown")+' · '+evidenceLink(finish.evidence,"Finish-line evidence")+((x.status==="done"||x.status==="verified_dev")?' <b>Dev test:</b> '+esc(dev.status||"Unknown")+' · '+evidenceLink(dev.evidence,"Dev test evidence"):"")+'</p>':'';
const proofImages=images(x).length?'<div class="proof-images">'+images(x).map(v=>'<figure><a href="'+esc(safeUrl(v.path))+'"><img src="'+esc(safeUrl(v.path))+'" alt="'+esc(v.caption||"Feature evidence screenshot")+'" loading="lazy"></a><figcaption>'+esc(v.caption||"Feature evidence screenshot")+'</figcaption></figure>').join("")+'</div>':((x.status==="local_working"||x.status==="done"||x.status==="verified_dev")?'<p>Screenshot evidence not recorded.</p>':'');
html+='<details class="item"><summary><span class="item-label"><span class="item-id">'+esc(x.id)+'</span><span class="item-name">'+esc(x.title)+'</span>'+(x.plainSummary?'<span class="item-plain">'+esc(x.plainSummary)+'</span>':x.status==="blocked"?'<span class="item-plain">Blocker explanation not yet added.</span>':'')+'</span><span class="status-cell"><span class="badge '+esc(x.status)+'">'+esc(x.status==="blocked"?(x.blockerState==="needs_decision"||(!x.blockerState&&!answered(x))?"Blocked · needs answer":"Blocked after answer"):(badgeLabel))+'</span>'+(p!==null?'<span class="percentage">~'+p+'%</span>':"")+'</span></summary><div class="item-details">'+decision+proofText+proofImages+(String(x.detail||'').length>600?'<details class="history"><summary>Evidence and history</summary><p>'+esc(x.detail)+'</p></details>':'<p>'+esc(x.detail)+'</p>')+(meta||source?'<p>'+meta+source+'</p>':"")+(x.note?'<p><b>Recorded note:</b> '+esc(x.note)+'</p>':"")+'<p><b>Time:</b> '+esc(x.time||"Unknown")+' · <b>Tokens:</b> '+esc(x.tokens||"Unknown")+'</p>'+(x.usageNote?'<p><b>Usage basis:</b> '+esc(x.usageNote)+'</p>':"")+'</div></details>';});html+='</details>';});root.innerHTML=html||'<p class="empty">No items match this filter.</p>';document.getElementById('result-count').textContent=(query||filter!=='all')?shown+' of '+all.length+' entries shown':'';}
[root,focusRoot].forEach(container=>container.addEventListener("change",event=>{const box=event.target.closest("input[data-choice]");if(!box)return;if(box.checked)selectedPaths.add(box.dataset.choice);else selectedPaths.delete(box.dataset.choice);document.querySelectorAll("input[data-choice]").forEach(other=>{if(other.dataset.choice===box.dataset.choice)other.checked=box.checked;});saveDraft();updateBulk();}));
[root,focusRoot].forEach(container=>container.addEventListener("input",event=>{const field=event.target.closest("textarea[data-writein]");if(!field)return;const id=field.dataset.writein;if(field.value)writeIns.set(id,field.value);else writeIns.delete(id);document.querySelectorAll("textarea[data-writein]").forEach(other=>{if(other!==field&&other.dataset.writein===id)other.value=field.value;});saveDraft();updateBulk();}));
document.getElementById("clear-selected").addEventListener("click",()=>{selectedPaths.clear();writeIns.clear();document.querySelectorAll("input[data-choice]").forEach(box=>box.checked=false);document.querySelectorAll("textarea[data-writein]").forEach(field=>field.value="");saveDraft();updateBulk();});
document.getElementById("copy-selected").addEventListener("click",async()=>{const entries=[...selectedPaths,...Array.from(writeIns,([id,note])=>note.trim()?id+" - Write-in: "+note.trim():"").filter(Boolean)];if(!entries.length)return;const value=entries.join("\n"),feedback=document.getElementById("bulk-feedback"),fallback=document.getElementById("bulk-fallback");let copied=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(value);copied=true;}}catch{}if(!copied){fallback.hidden=false;fallback.value=value;fallback.focus();fallback.select();try{copied=document.execCommand("copy");}catch{}if(copied)fallback.hidden=true;}feedback.textContent=copied?"Copied. Paste the selected paths into chat.":"Copy unavailable. Select and copy the paths below.";});
[root,focusRoot].forEach(container=>container.addEventListener("click",async event=>{const button=event.target.closest("button[data-copy]");if(!button)return;const value=button.dataset.copy,feedback=button.closest(".decision").querySelector(".copy-feedback");let copied=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(value);copied=true;}}catch{}if(!copied){const field=document.createElement("textarea");field.value=value;field.setAttribute("readonly","");field.style.cssText="position:fixed;left:-9999px;top:0";document.body.appendChild(field);field.select();try{copied=document.execCommand("copy");}catch{}field.remove();}feedback.classList.toggle("failed",!copied);feedback.textContent=copied?"Copied. Paste it into chat to confirm.":"Copy failed. Select and copy: "+value;}));
document.getElementById("stats").addEventListener("click",event=>{const button=event.target.closest("button[data-filter]");if(!button)return;const filter=document.getElementById("filter");filter.value=filter.value===button.dataset.filter?"all":button.dataset.filter;render();});
document.getElementById("search").addEventListener("input",render);document.getElementById("filter").addEventListener("change",render);document.getElementById("expand").addEventListener("click",()=>root.querySelectorAll(".panel").forEach(el=>el.open=true));document.getElementById("collapse").addEventListener("click",()=>root.querySelectorAll(".panel").forEach(el=>el.open=false));
const s=d.sources||{};document.getElementById("footer").innerHTML='Point-in-time report · '+Object.entries(s).filter(([,url])=>/^https:\/\//.test(url)).map(([name,url])=>'<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(name)+' source</a>').join(' · ');render();updateBulk();})();
</script></body></html>
