name: Public library checks
on: [push, pull_request]
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: python3 scripts/test-public-validation.py
      - run: ruby scripts/validate-skill-metadata.rb
      - run: python3 scripts/validate-public-library.py
      - run: ruby scripts/generate-portable-playbooks.rb
      - run: git diff --exit-code -- portable-agent-playbooks
      - run: git diff --check
